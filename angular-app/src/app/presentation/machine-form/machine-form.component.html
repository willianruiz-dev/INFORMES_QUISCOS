<form (ngSubmit)="save()" #form="ngForm">
  <div class="modal-header">
    <div class="dialog-heading"><span class="dialog-icon"><svg lucideIcon="monitor-cog" [size]="19"></svg></span><span><h2 id="machine-dialog-title">{{ machine ? 'Editar máquina' : 'Nueva máquina' }}</h2><p>Organiza tus equipos en un solo lugar.</p></span></div>
    <button type="button" class="icon-button" aria-label="Cerrar" (click)="closed.emit()"><svg lucideIcon="x" [size]="19"></svg></button>
  </div>
  <div class="dialog-body">
    @if (error) { <div class="error-box" role="alert">{{ error }}</div> }
    <div><label class="field-label" for="machine-name">Nombre de la máquina <span class="required">*</span></label><input class="field" id="machine-name" name="name" [(ngModel)]="name" maxlength="120" placeholder="Ej. SuSuerte - Cable Aéreo" autocomplete="off" required data-modal-focus><p class="field-help">Usa un nombre que te ayude a identificarla fácilmente.</p></div>
    <div><label class="field-label" for="machine-location">Ubicación <span class="optional">OPCIONAL</span></label><input class="field" id="machine-location" name="location" [(ngModel)]="location" maxlength="150" placeholder="Ej. Medellín, estación central" autocomplete="off"><p class="field-help">Puedes agregar la sede, ciudad o punto de servicio.</p></div>
  </div>
  <div class="modal-footer"><button type="button" class="button-secondary" (click)="closed.emit()">Cancelar</button><button type="submit" class="button-primary" [disabled]="saving">{{ saving ? 'Guardando...' : (machine ? 'Guardar cambios' : 'Crear máquina') }} <svg lucideIcon="arrow-right" [size]="15"></svg></button></div>
</form>
