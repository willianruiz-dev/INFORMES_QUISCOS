server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Las rutas Angular usan # y también se admite un fallback de SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(js|css|wasm|woff2?|ttf|png|jpe?g|svg)$ {
        try_files $uri =404;
    }
}
